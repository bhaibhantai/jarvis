name: Build J.A.R.V.I.S. for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - openrouter-integration

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build renderer (TypeScript + Vite)
        run: npm run build
      - name: Verify desktop entry files
        shell: pwsh
        run: |
          if (!(Test-Path "dist/index.html")) { throw "Vite build did not produce dist/index.html" }
          if (!(Test-Path "electron/main.cjs")) { throw "Electron main process is missing" }
          if (!(Test-Path "bridge/openrouter-server.mjs")) { throw "OpenRouter bridge is missing" }
          if (!(Test-Path "bridge/desktop-tools.mjs")) { throw "Windows desktop tools are missing" }
      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never
        env:
          DEBUG: electron-builder
      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 14
